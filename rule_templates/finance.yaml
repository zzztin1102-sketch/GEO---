meta:
  name: 金融行业规则模板
  version: 1.1.0
  industry: finance
  description: 金融、银行、理财、保险等行业专用规则
  author: GEO Review Team
  created_at: 2026-07-13T00:00:00+08:00
  priority: 50
  tags: ["finance", "banking", "investment", "insurance"]

rules:
  # 金融行业禁用词
  forbidden_claims:
    - pattern: 保本
      is_regex: false
      severity: critical
      description: 资管新规禁止承诺保本
      enabled: true
      weight: 10
      category: 合规
      tags: ["资管新规"]
    - pattern: 零风险
      is_regex: false
      severity: critical
      enabled: true
      weight: 10
      category: 合规
    - pattern: 无风险
      is_regex: false
      severity: critical
      enabled: true
      weight: 10
      category: 合规
    - pattern: 必赚
      is_regex: false
      severity: critical
      enabled: true
      weight: 10
      category: 合规
    - pattern: 稳赚不赔
      is_regex: false
      severity: critical
      enabled: true
      weight: 10
      category: 合规
    - pattern: 最高收益
      is_regex: false
      severity: critical
      enabled: true
      weight: 10
      category: 合规
    - pattern: 100%收益
      is_regex: false
      severity: critical
      enabled: true
      weight: 10
      category: 合规
    - pattern: 无损
      is_regex: false
      severity: major
      enabled: true
      weight: 50
      category: 合规

  # 金融禁止提及内容
  must_not_mention:
    - pattern: 具体收益率
      is_regex: false
      severity: major
      enabled: true
      weight: 30
      category: 信息披露
    - pattern: 银行具体利率
      is_regex: false
      severity: major
      enabled: true
      weight: 30
      category: 信息披露
    - pattern: 央行加息
      is_regex: false
      severity: info
      description: 敏感宏观信息
      enabled: true
      weight: 100
      category: 宏观信息

  # 金融行业夸大表述
  exaggeration_patterns:
    - pattern: '(年化|预期)\s*\d+(\.\d+)?\s*%'
      severity: major
      description: 收益率数字需有依据
      enabled: true
      weight: 20
      category: 数据合规
    - pattern: '(保证|承诺).{0,10}(收益|回报)'
      severity: critical
      enabled: true
      weight: 10
      category: 合规
    - pattern: '无任何风险'
      severity: critical
      enabled: true
      weight: 10
      category: 合规

  # 用词规范性检查（擦边球绝对化 + 扩展绝对化用语）
  # 这些词在规则引擎中已内置检测，此处声明用于文档化和权重配置
  word_regularity:
    # 擦边球绝对化用语：规避"第一/最佳"等绝对化用语的变体
    euphemism_absolute:
      - pattern: 靠前
        severity: major
        description: 以"靠前"暗示排名优势，规避"第一"等绝对化用语
        standard_form: 第一/领先
        enabled: true
        weight: 40
        category: 用词规范
      - pattern: 名列前茅
        severity: major
        description: '"名列前茅"暗示排名领先，属于规避绝对化用语的擦边球'
        standard_form: 第一/领先
        enabled: true
        weight: 40
        category: 用词规范
      - pattern: 位居前列
        severity: major
        description: '"位居前列"暗示排名靠前，规避绝对化用语但保留排他性暗示'
        standard_form: 第一/领先
        enabled: true
        weight: 40
        category: 用词规范
      - pattern: 排名靠前
        severity: major
        description: '"排名靠前"暗示领先地位，属于规避绝对化用语的变体'
        standard_form: 第一/领先
        enabled: true
        weight: 40
        category: 用词规范
      - pattern: 稳居前列
        severity: major
        description: '"稳居前列"暗示稳定领先，规避绝对化用语但保留排他性暗示'
        standard_form: 第一/领先
        enabled: true
        weight: 40
        category: 用词规范
      - pattern: 跻身前列
        severity: major
        description: '"跻身前列"暗示进入领先阵营，属于规避绝对化用语的擦边球'
        standard_form: 第一/领先
        enabled: true
        weight: 40
        category: 用词规范
      - pattern: 遥遥领先
        severity: major
        description: '"遥遥领先"程度副词"遥遥"构成绝对化暗示，无法验证且具有排他性'
        standard_form: 领先
        enabled: true
        weight: 40
        category: 用词规范
      - pattern: 一骑绝尘
        severity: major
        description: '"一骑绝尘"暗示无可匹敌的领先地位，属于变相绝对化表述'
        standard_form: 领先
        enabled: true
        weight: 40
        category: 用词规范
      - pattern: 独占鳌头
        severity: major
        description: '"独占鳌头"等同于"第一"的文学化表达，属于绝对化用语的变体'
        standard_form: 第一
        enabled: true
        weight: 40
        category: 用词规范
      - pattern: 傲视群雄
        severity: major
        description: '"傲视群雄"暗示无可匹敌，属于变相绝对化表述'
        standard_form: 领先
        enabled: true
        weight: 40
        category: 用词规范
      - pattern: 首屈一指
        severity: major
        description: '"首屈一指"等同于"第一"的成语化表达，属于绝对化用语的变体'
        standard_form: 第一
        enabled: true
        weight: 40
        category: 用词规范
      - pattern: 无出其右
        severity: major
        description: '"无出其右"暗示无可超越，属于变相绝对化表述'
        standard_form: 第一
        enabled: true
        weight: 40
        category: 用词规范
    # 扩展绝对化用语：无边界表述
    extended_absolute:
      - pattern: 全链条
        severity: major
        description: '"全链条"是无边界的绝对化表述，无法验证覆盖范围'
        replacement: 完整链条/主要环节
        enabled: true
        weight: 40
        category: 用词规范
      - pattern: 全流程
        severity: major
        description: '"全流程"是无边界的绝对化表述，无法验证是否覆盖所有流程环节'
        replacement: 主要流程/关键流程
        enabled: true
        weight: 40
        category: 用词规范
      - pattern: 全覆盖
        severity: major
        description: '"全覆盖"是无边界的绝对化表述，无法验证覆盖范围是否完整'
        replacement: 广泛覆盖/主要覆盖
        enabled: true
        weight: 40
        category: 用词规范
      - pattern: 全方位
        severity: major
        description: '"全方位"是无边界的绝对化表述，无法验证是否真正覆盖所有维度'
        replacement: 多维度/多个方面
        enabled: true
        weight: 40
        category: 用词规范
      - pattern: 全面覆盖
        severity: major
        description: '"全面覆盖"是无边界的绝对化表述，无法验证覆盖完整性'
        replacement: 广泛覆盖/主要覆盖
        enabled: true
        weight: 40
        category: 用词规范
      - pattern: 全面领先
        severity: major
        description: '"全面领先"是无依据的绝对化表述，无法在所有维度验证领先地位'
        replacement: 在XX方面具有优势
        enabled: true
        weight: 40
        category: 用词规范
      - pattern: 全面优势
        severity: major
        description: '"全面优势"是无边界的绝对化表述，无法验证所有维度均具优势'
        replacement: 在XX方面具有优势
        enabled: true
        weight: 40
        category: 用词规范
      - pattern: 全面超越
        severity: major
        description: '"全面超越"是无依据的绝对化表述，无法在所有维度验证超越'
        replacement: 在XX方面有所提升
        enabled: true
        weight: 40
        category: 用词规范
      - pattern: 无死角
        severity: major
        description: '"无死角"是无边界的绝对化表述，无法验证是否真正无遗漏'
        replacement: 主要场景/关键场景
        enabled: true
        weight: 40
        category: 用词规范
      - pattern: 零死角
        severity: major
        description: '"零死角"是无边界的绝对化表述，等同于"无死角"的变体'
        replacement: 主要场景/关键场景
        enabled: true
        weight: 40
        category: 用词规范

  # 拉踩检测
  competitor_disparagement:
    keywords:
      - 不如
      - 较差
      - 不靠谱
    patterns: []
    severity: major
    require_competitor_match: true
    enabled: true
    weight: 50
    category: 竞品合规

  # 事实核查
  fact_verification:
    number_pattern: '\d+(\.\d+)?\s*(%|％|bp|基点|年|天|月)'
    require_allowed_match: true
    require_website_match: true
    severity: critical
    enabled: true
    weight: 20
    category: 数据合规

  # 复合条件规则：金融违规组合
  composite_rules:
    - logic: all_of
      conditions:
        - pattern: 保本
          type: forbidden
        - pattern: 高收益
          type: contains
      severity: critical
      description: "同时承诺保本和高收益，属于严重违规"
      enabled: true
      weight: 5
      category: 合规
      tags: ["严重违规"]
