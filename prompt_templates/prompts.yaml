# ================================================================
# User Prompt 模板（使用 {variable} 占位符）
# ================================================================
templates:
  review: |
    ## 待审正文
    ---
    {content}
    ---

    ## 提报表信息（审核基准，请逐条核对）
    ### 任务背景
    - 任务名称: {task_name}
    - 公司/品牌: {company_name}
    - 产品/服务: {product_list}
    - 核心主题: {core_topic}

    ### 核心意图与关键信息
    {key_points_list}

    ### 允许出现的事实/数据边界
    {allowed_facts_list}

    ### 标准表述参考
    {reference_copy_list}

    ### 绝对禁用表述
    {forbidden_list}

    ### 敏感内容边界
    {must_not_mention_list}

    ### 竞品敏感词
    {competitor_list}

    ## 官网信息（事实核对基准）
    {website_summary}

    ---
    请基于以上信息对正文进行审核，输出 JSON 格式的审核结果。

  website_summary: |
    从官网爬取的内容摘要:
    {website_text}
