<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEO 生文审核系统</title>
    <link rel="stylesheet" href="/static/css/style.css?v=20260812c">
</head>
<body>
    <div id="app">
        <!-- 登录/注册页面容器 -->
        <div id="login-page" style="display:none;"></div>

        <!-- 主应用布局 -->
        <div id="main-layout" class="app-layout" style="display:none;">
            <!-- 侧边栏 -->
            <aside id="sidebar" class="sidebar">
                <!-- 由 JS 动态渲染 -->
            </aside>

            <!-- 主内容区 -->
            <div class="main-container">
                <!-- 顶部栏 -->
                <header id="topbar" class="topbar">
                    <!-- 由 JS 动态渲染 -->
                </header>

                <!-- 页面内容 -->
                <main id="app-content" class="page-content">
                    <!-- 由 JS 动态渲染 -->
                </main>
            </div>
        </div>

        <!-- 模态框容器 -->
        <div id="modal-container"></div>

        <!-- Toast 容器 -->
        <div id="toast-container" class="toast-container"></div>

        <!-- 加载遮罩 -->
        <div id="loading-overlay" class="loading-overlay" style="display:none;">
            <div class="spinner spinner-lg"></div>
        </div>
    </div>

    <script src="/static/js/app.js?v=20260812c"></script>
</body>
</html>
